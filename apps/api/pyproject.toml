# Gaming PM Agent - API Backend
# FastAPI + Uvicorn

[project]
name = "gaming-pm-api"
version = "0.1.0"
description = "Data-driven gaming product manager agent backend"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
