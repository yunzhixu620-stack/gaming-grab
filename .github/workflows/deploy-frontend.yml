# GitHub Actions — Deploy frontend to GitHub Pages (SIMPLEST)
# Just push to master → auto-deploy. No secrets needed.
#
# Setup (ONE TIME):
#   Go to repo Settings → Pages → Source = "GitHub Actions"
#   That's it. Every push to master auto-deploys.

name: Deploy Frontend

on:
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
          working-directory: apps/web

      - name: Install & Build
        working-directory: apps/web
        run: |
          npm ci
          npm run build
        env:
          # Default API URL — update after backend is deployed
          NEXT_PUBLIC_API_URL: ${{ vars.API_BASE_URL || '' }}

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
